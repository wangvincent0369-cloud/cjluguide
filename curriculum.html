<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中国计量大学2026级培养方案指南</title>

<style>
        * {
            margin:0;
            padding:0;
            box-sizing:border-box;
        }
        
        body {
            zoom:75%;
            font-family:var(--font);
            background:var(--bg);
            min-height:100vh;
            color:var(--text);
        }
        
        /* 头部样式 */
        .header {
            padding:var(--gap-4xl) var(--gap-2xl) var(--gap-3xl);
            text-align:center;
        }

        .header h1 {
            font-size:var(--fs-h1);
            font-weight:800;
            margin-bottom:var(--gap-md);
            background:linear-gradient(135deg, var(--accent), var(--purple), var(--pink));
            -webkit-background-clip:text;
            background-clip:text;
            -webkit-text-fill-color:transparent;
            color:transparent;
        }
        
        .header p {
            color:var(--text);
            font-size:var(--fs-xl-em);
        }
        
        /* 搜索框 */
        .search-container {
            max-width:var(--w-grid);
            margin:30px auto;
            padding:0 var(--gap-2xl);
        }
        
        .search-box {
            width:100%;
            padding:var(--gap-xl) var(--gap-3xl);
            font-size:var(--fs-xl-em);
            border:none;
            border-radius:var(--r-lg);
            background:var(--card2);
            color:var(--text);
            backdrop-filter:blur(10px);
            box-shadow:0 4px 15px rgba(15,23,42,.08);
            transition:all 0.3s ease;
        }
        
        .search-box:focus {
            outline:none;
            background:var(--card);
            box-shadow:0 4px 20px rgba(102, 126, 234, 0.4);
        }
        
        .search-box::placeholder {
            color:var(--sub2);
        }
        
        /* 学院导航 */
        .college-nav {
            max-width:var(--w-grid);
            margin:20px auto;
            padding:0 var(--gap-2xl);
            display:flex;
            flex-wrap:wrap;
            gap:var(--gap-md);
            justify-content:center;
        }
        
        .college-btn {
            padding:var(--gap-md) var(--gap-2xl);
            border:none;
            border-radius:var(--r-lg);
            background:var(--card2);
            color:var(--text);
            cursor:pointer;
            transition:all 0.3s ease;
            font-size:var(--fs-md-em);
        }
        
        .college-btn:hover, .college-btn.active {
            background:linear-gradient(135deg, var(--accent), var(--purple), var(--pink)); color:#FFFFFF;
            transform:translateY(-2px);
            box-shadow:0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        /* 专业列表 */
        .container {
            max-width:var(--w-grid);
            margin:0 auto;
            padding:var(--gap-2xl);
            display:grid;
            grid-template-columns:repeat(auto-fill, minmax(350px, 1fr));
            gap:var(--gap-3xl);
        }
        
        /* 专业卡片 */
        .major-card {
            background:var(--card);
            border-radius:var(--r-lg);
            padding:var(--gap-3xl);
            backdrop-filter:blur(10px);
            border:1px solid var(--line);
            transition:all 0.3s ease;
            cursor:pointer;
        }
        
        .major-card:hover {
            transform:translateY(-5px);
            background:var(--card2);
            border-color:rgba(102, 126, 234, 0.5);
            box-shadow:0 10px 30px rgba(15,23,42,.08);
        }
        
        .card-header {
            display:flex;
            justify-content:space-between;
            align-items:flex-start;
            margin-bottom:var(--gap-xl);
        }
        
        .major-name {
            font-size:var(--fs-h2-em);
            font-weight:bold;
            color:var(--accent);
            margin-bottom:var(--gap-xs);
        }
        
        .college-tag {
            display:inline-block;
            padding:var(--gap-xs) var(--gap-lg);
            background:rgba(102, 126, 234, 0.2);
            border-radius:var(--r-lg);
            font-size:var(--fs-sm-em);
            color:#2039B7;
        }
        
        .credit-info {
            display:flex;
            gap:var(--gap-xl);
            margin:var(--gap-xl) 0;
            padding:var(--gap-xl);
            background:rgba(0,0,0,0.2);
            border-radius:var(--r-md);
        }
        
        .credit-item {
            text-align:center;
            flex:1;
        }
        
        .credit-value {
            font-size:var(--fs-h2-em);
            font-weight:bold;
            color:var(--purple);
        }
        
        .credit-label {
            font-size:var(--fs-xs-em);
            color:var(--sub);
            margin-top:var(--gap-xs);
        }
        
        .core-courses {
            margin-top:var(--gap-xl);
        }
        
        .core-courses h4 {
            color:var(--sub);
            font-size:var(--fs-md-em);
            margin-bottom:var(--gap-md);
        }
        
        .course-tags {
            display:flex;
            flex-wrap:wrap;
            gap:var(--gap);
        }
        
        .course-tag {
            padding:var(--gap-xs) var(--gap-lg);
            background:var(--card2);
            border-radius:var(--r-md);
            font-size:var(--fs-sm-em);
            color:var(--sub2);
        }
        
        .simplified-goal {
            margin-top:var(--gap-xl);
            padding:var(--gap-lg);
            background:rgba(102, 126, 234, 0.1);
            border-radius:var(--r-sm);
            font-size:var(--fs-md-em);
            color:var(--sub2);
            border-left:3px solid var(--brand-light);
        }
        
        /* 弹窗样式 */
        .modal {
            display:none;
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.8);
            z-index:1000;
            overflow-y:auto;
            padding:var(--gap-5xl) var(--gap-2xl);
        }
        
        .modal.active {
            display:flex;
            justify-content:center;
            align-items:flex-start;
        }
        
        .modal-content {
            background:linear-gradient(135deg, #FFFFFF 0%, var(--bg) 100%);
            border-radius:var(--r-lg);
            max-width:var(--w-wide);
            width:100%;
            padding:var(--gap-5xl);
            position:relative;
            border:1px solid var(--line);
            box-shadow:0 20px 60px rgba(15,23,42,.08);
        }
        
        .close-btn {
            position:absolute;
            top:20px;
            right:25px;
            font-size:var(--fs-h1);
            color:var(--sub);
            cursor:pointer;
            transition:color 0.3s;
        }
        
        .close-btn:hover {
            color:var(--text);
        }
        
        .modal-header {
            text-align:center;
            margin-bottom:var(--gap-4xl);
            padding-bottom:var(--gap-2xl);
            border-bottom:1px solid var(--line);
        }
        
        .modal-header h2 {
            font-size:var(--fs-h1);
            color:var(--accent);
            margin-bottom:var(--gap-md);
        }
        
        .modal-header .college-info {
            color:var(--sub);
            font-size:var(--fs-lg-em);
        }
        
        /* 学分分配可视化 */
        .credit-breakdown {
            display:grid;
            grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));
            gap:var(--gap-xl);
            margin:var(--gap-2xl) 0;
        }
        
        .credit-block {
            background:var(--card);
            padding:var(--gap-xl);
            border-radius:var(--r-md);
            text-align:center;
        }
        
        .credit-block .label {
            color:var(--sub);
            font-size:var(--fs-md-em);
            margin-bottom:var(--gap);
        }
        
        .credit-block .value {
            font-size:var(--fs-h2-em);
            font-weight:bold;
            color:var(--purple);
        }
        
        .credit-block .bar {
            height:6px;
            background:rgba(102, 126, 234, 0.3);
            border-radius:var(--r-xs);
            margin-top:var(--gap-md);
            overflow:hidden;
        }
        
        .credit-block .bar-fill {
            height:100%;
            background:linear-gradient(90deg, var(--accent), var(--purple));
            border-radius:var(--r-xs);
            transition:width 0.5s ease;
        }
        
        /* 课程表 */
        .schedule-section {
            margin-top:var(--gap-4xl);
        }
        
        .schedule-section h3 {
            color:var(--accent);
            margin-bottom:var(--gap-xl);
            font-size:var(--fs-xl-em);
        }
        
        .semester-grid {
            display:grid;
            grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));
            gap:var(--gap-xl);
        }
        
        .semester-block {
            background:var(--card);
            border-radius:var(--r-md);
            padding:var(--gap-xl);
            border:1px solid var(--line);
        }
        
        .semester-block h4 {
            color:var(--accent);
            margin-bottom:var(--gap-md);
            font-size:var(--fs-lg-em);
        }
        
        .semester-block ul {
            list-style:none;
            font-size:var(--fs-sm-em);
            color:var(--sub);
        }
        
        .semester-block li {
            padding:var(--gap-xs) 0;
            border-bottom:1px solid var(--line);
        }
        
        .semester-block li:last-child {
            border-bottom:none;
        }
        
        /* 核心课程详情 */
        .core-courses-detail {
            margin-top:var(--gap-4xl);
        }
        
        .core-courses-detail h3 {
            color:var(--accent);
            margin-bottom:var(--gap-xl);
        }
        
        .core-list {
            display:flex;
            flex-wrap:wrap;
            gap:var(--gap-md);
        }
        
        .core-item {
            background:rgba(102, 126, 234, 0.2);
            padding:var(--gap) var(--gap-xl);
            border-radius:var(--r-lg);
            font-size:var(--fs-md-em);
            color:#2039B7;
        }
        
        /* 毕业要求 */
        .requirements-section {
            margin-top:var(--gap-4xl);
            padding:var(--gap-2xl);
            background:var(--card);
            border-radius:var(--r-md);
        }
        
        .requirements-section h3 {
            color:var(--accent);
            margin-bottom:var(--gap-xl);
        }
        
        .requirements-text {
            color:var(--sub);
            font-size:var(--fs-md-em);
            line-height:var(--lh-loose);
        }
        
        /* 隐藏类 */
        .hidden {
            display:none !important;
        }
        
        /* 统计信息 */
        .stats {
            text-align:center;
            padding:var(--gap-2xl);
            color:var(--sub);
            font-size:var(--fs-md-em);
        }
        

        /* 生存问答样式 */
        .survival-qa {
            margin-top:var(--gap-4xl);
            padding:var(--gap-2xl);
            background:rgba(102, 126, 234, 0.08);
            border-radius:var(--r-md);
            border:1px solid rgba(102, 126, 234, 0.2);
        }
        
        .survival-qa h3 {
            color:var(--accent);
            margin-bottom:var(--gap-2xl);
            font-size:var(--fs-xl-em);
            display:flex;
            align-items:center;
            gap:var(--gap);
        }
        
        .qa-item {
            margin-bottom:var(--gap-xl);
            padding:var(--gap-xl);
            background:var(--card);
            border-radius:var(--r-md);
            border-left:3px solid var(--brand-light);
        }
        
        .qa-item.warning {
            background:rgba(239, 68, 68, 0.08);
            border-left-color:#ef4444;
        }
        
        .qa-item.info {
            background:rgba(59, 130, 246, 0.08);
            border-left-color:#3b82f6;
        }
        
        .qa-q {
            color:var(--purple);
            font-weight:600;
            margin-bottom:var(--gap);
            font-size:var(--fs-md-em);
        }
        
        .qa-item.warning .qa-q {
            color:var(--red);
        }
        
        .qa-item.info .qa-q {
            color:var(--accent);
        }
        
        .qa-a {
            color:var(--text);
            font-size:var(--fs-md-em);
            line-height:var(--lh);
        }
        
        .warning-text {
            color:var(--yellow);
            font-size:var(--fs-sm-em);
            display:inline-block;
            margin-bottom:var(--gap);
            background:rgba(251, 191, 36, 0.1);
            padding:var(--gap-xs) var(--gap);
            border-radius:var(--r-xs);
        }
        
        .info-text {
            color:var(--accent);
            font-size:var(--fs-sm-em);
            display:block;
            margin-top:var(--gap);
            background:rgba(59, 130, 246, 0.1);
            padding:var(--gap) var(--gap-md);
            border-radius:var(--r-sm);
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .container {
                grid-template-columns:1fr;
            }
            
            .modal-content {
                padding:var(--gap-3xl);
            }
            
            .header h1 {
                font-size:var(--fs-h1);
            }
        }
    
/* Watermark */
/* ===== 结尾转化卡 ===== */
.cta-card{max-width:var(--w-narrow);margin:26px auto 34px;background:var(--card);border:1px solid var(--line2);border-radius:var(--r-lg);padding:var(--gap-2xl) var(--gap-2xl);text-align:center;box-shadow:0 10px 34px rgba(15,23,42,.08)}
.cta-hook{margin:0 0 var(--gap-lg);color:var(--text);font-size:var(--fs-xl);font-weight:700;letter-spacing:.5px}

.cta-wx-id{color:var(--text);font-size:var(--fs-xl);font-weight:700;letter-spacing:2px;user-select:all;-webkit-user-select:all}
.cta-wx-tip{color:var(--sub2);font-size:var(--fs-xs)}

.cta-ask b{color:var(--accent)}
.cta-note{margin:var(--gap-md) 0 0;color:var(--sub);font-size:var(--fs-2xs);line-height:var(--lh)}

.cta-home:hover{color:var(--text)}
@media(max-width:640px){.cta-card{padding:var(--gap-xl) var(--gap-lg)}.cta-hook{font-size:var(--fs-lg)}}
</style>
</head>
